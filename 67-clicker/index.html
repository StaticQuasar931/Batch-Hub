      staticSlideImage.src = item.image;
      staticSlideImage.alt = item.alt;
      staticSlideLink.href = item.href;
      staticSlideLink.setAttribute("aria-label", item.label);
      staticSlideMenu.classList.remove("slide-out");
      staticSlideMenu.classList.add("slide-in");
      window.setTimeout(function(){
        staticSlideMenu.classList.remove("slide-in");
        staticSlideMenu.classList.add("slide-out");
      }, 6500);
      slideIndex++;
    }
    if(closeStaticMenu && staticMenu){
      closeStaticMenu.addEventListener("click", function(){
        staticMenu.classList.add("visual-seo-hidden");
        window.clearTimeout(menuRestoreTimer);
        menuRestoreTimer = window.setTimeout(function(){
          if(visualSeoVisible) staticMenu.classList.remove("visual-seo-hidden");
        }, 180000);
      });
    }
    document.addEventListener("keydown", function(event){
      keySequence = (keySequence + String(event.key || "").toLowerCase()).slice(-3);
      if(keySequence === "yui"){
        setVisualSeoVisible(!visualSeoVisible);
        keySequence = "";
      }
    }, true);
    setVisualSeoVisible(true);
    window.setTimeout(rotateSlide, 1800);
    window.setInterval(rotateSlide, 12500);
  })();
</script>
</body>

</html>
