  <script>
    async function joinParts(paths, type){
      var chunks = [];
      for(var i=0;i<paths.length;i++){
        var res = await fetch(paths[i]);
        if(!res.ok) throw new Error(paths[i] + " " + res.status);
        chunks.push(await res.arrayBuffer());
      }
      return URL.createObjectURL(new Blob(chunks, {type:type}));
    }
    (async function(){
      var canvas = document.getElementById("unity-canvas");
      var panel = document.getElementById("loadingPanel");
      var fill = document.getElementById("progressFill");
      var text = document.getElementById("loadText");
      try{
        if(text) text.textContent = "Joining local data";
        var dataUrl = await joinParts(["bin/robbi.data.part0","bin/robbi.data.part1","bin/robbi.data.part2","bin/robbi.data.part3"], "application/octet-stream");
        if(text) text.textContent = "Joining local WebAssembly";
        var codeUrl = await joinParts(["bin/robbi.wasm.part0","bin/robbi.wasm.part1","bin/robbi.wasm.part2","bin/robbi.wasm.part3","bin/robbi.wasm.part4","bin/robbi.wasm.part5"], "application/wasm");
        await createUnityInstance(canvas, {
          dataUrl: dataUrl,
          frameworkUrl: "bin/robbi.framework.js",
          codeUrl: codeUrl,
          streamingAssetsUrl: "streaming",
          companyName: "DefaultCompany",
          productName: "Meccha Chameleon",
          productVersion: "0.1",
          showBanner: function(message, type){ console[type === "error" ? "error" : "warn"](message); }
        }, function(progress){
          if(fill) fill.style.width = Math.max(2, Math.round(progress * 100)) + "%";
          if(text) text.textContent = "Loading " + Math.round(progress * 100) + "%";
        });
        if(panel) panel.style.display = "none";
        canvas.focus();
      }catch(err){
        console.error(err);
        if(panel) panel.innerHTML = "<strong>Load failed</strong><p>Check local file paths and console details.</p>";
      }
    })();
    var localServicesWrapper = window.localServicesWrapper;

        a.href = state.link;

        img.style.opacity = "0";

      async function cycle(){

      }, true);
